name: Add approved tool

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: tools-json
  cancel-in-progress: false

jobs:
  add-tool:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;
            const comment = body => github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });

            // Only people with write access may approve.
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: context.payload.sender.login });
            if (!["admin", "write"].includes(perm.permission)) {
              core.setFailed("Label was added by someone without write access.");
              return;
            }

            async function fail(msg) {
              await comment(`Could not add this tool: ${msg} Fix the record in the issue, then add the label again.`);
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: "approved" }).catch(() => {});
              core.setFailed(msg);
            }

            // Read the JSON record from the issue.
            const block = (issue.body || "").match(/```json\s*([\s\S]*?)```/);
            if (!block) return fail("No JSON record found.");
            let rec;
            try { rec = JSON.parse(block[1]); } catch (e) { return fail("The JSON record has a format error."); }

            async function load(path) {
              const { data } = await github.rest.repos.getContent({ owner, repo, path });
              return { sha: data.sha, json: JSON.parse(Buffer.from(data.content, "base64").toString("utf8")) };
            }
            const schema = (await load("data/schema.json")).json;
            const toolsFile = await load("data/tools.json");
            const tools = toolsFile.json;

            // Check every value against the schema. Unknown fields are dropped.
            const dims = schema.branches.flatMap(b => b.dimensions);
            const text = (v, max) => (typeof v === "string" && v.trim() && v.trim().length <= max ? v.trim() : null);
            const name = text(rec.name, 80);
            if (!name) return fail("The tool name is missing or longer than 80 characters.");
            if (!Array.isArray(rec.modes) || rec.modes.length < 1 || rec.modes.length > 10) return fail("The record needs 1 to 10 modes.");

            const modes = [];
            for (const [i, m] of rec.modes.entries()) {
              const mode = { name: text(m && m.name, 60) || `Mode ${i + 1}` };
              for (const d of dims) {
                const v = m ? m[d.id] : undefined;
                const bad = () => fail(`Mode ${i + 1} has an invalid value for "${d.label}".`);
                if (d.kind === "multi") {
                  if (!(Array.isArray(v) && v.length > 0 && v.every(x => d.values.includes(x)))) return bad();
                  mode[d.id] = d.values.filter(x => v.includes(x));
                } else if (d.kind === "single") {
                  if (!d.values.includes(v)) return bad();
                  mode[d.id] = v;
                } else if (d.kind === "bool") {
                  if (typeof v !== "boolean") return bad();
                  mode[d.id] = v;
                } else if (d.kind === "length") {
                  const unit = v && v.unit;
                  if (!d.values.includes(unit)) return bad();
                  const numeric = !!(schema.values[unit] && schema.values[unit].numeric);
                  if (numeric && !(typeof v.value === "number" && v.value > 0 && v.value <= 100000)) return bad();
                  mode[d.id] = numeric ? { unit, value: v.value } : { unit };
                } else {
                  return fail(`Unknown schema kind "${d.kind}".`);
                }
              }
              modes.push(mode);
            }

            const id = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || `tool-${issue.number}`;
            const entry = { id, name, status: "reviewed", modes };
            const index = tools.findIndex(t => t.id === id);
            if (index >= 0) tools[index] = { ...tools[index], ...entry };
            else tools.push(entry);

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo,
              path: "data/tools.json",
              message: `${index >= 0 ? "Update" : "Add"} ${name} (#${issue.number})`,
              content: Buffer.from(JSON.stringify(tools, null, 2) + "\n").toString("base64"),
              sha: toolsFile.sha
            });

            try { await github.rest.repos.requestPagesBuild({ owner, repo }); }
            catch (e) { core.info(`Pages build request skipped: ${e.message}`); }

            const safe = name.replace(/[`*_~<>@\[\]]/g, "");
            await comment(`${index >= 0 ? "Updated" : "Added"} **${safe}**. The website updates within a few minutes.`);
            await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed", state_reason: "completed" });
